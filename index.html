<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfbf9;
      color: #2d3748;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDFOX_ChE_wPHNGyrLXGC2MiGCmAbe6rc",
      authDomain: "haven-25b0b.firebaseapp.com",
      databaseURL: "https://haven-25b0b-default-rtdb.firebaseio.com",
      projectId: "haven-25b0b",
      storageBucket: "haven-25b0b.firebasestorage.app",
      messagingSenderId: "78209014568",
      appId: "1:78209014568:web:b29094b308f8e1683b8e1d",
      measurementId: "G-QZ3XKHX58M"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { useState, useEffect, useRef } = React;

    // Gentle Leaf Logo SVG
    const LeafLogo = () => (
      <svg className="w-7 h-7 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('ether');
      const [isPlayingRain, setIsPlayingRain] = useState(false);
      
      // Ether state (Private to local storage)
      const [etherText, setEtherText] = useState(() => localStorage.getItem('haven_ether') || '');
      
      // Safe Wall state (Synced via Firebase)
      const [wallPosts, setWallPosts] = useState([]);
      const [newPost, setNewPost] = useState('');
      
      // Social Battery state
      const [battery, setBattery] = useState(() => parseInt(localStorage.getItem('haven_battery')) || 50);

      // Audio Synthesizer for Gentle Rain
      const audioCtxRef = useRef(null);
      const rainSourceRef = useRef(null);

      // Save Ether text locally
      useEffect(() => {
        localStorage.setItem('haven_ether', etherText);
      }, [etherText]);

      // Save Battery locally
      useEffect(() => {
        localStorage.setItem('haven_battery', battery.toString());
      }, [battery]);

      // Connect to Firebase Realtime Database for Safe Wall
      useEffect(() => {
        const postsRef = db.ref('posts');
        postsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const formatted = Object.keys(data).map(key => ({
              id: key,
              ...data[key]
            })).reverse();
            setWallPosts(formatted);
          } else {
            setWallPosts([]);
          }
        });

        return () => postsRef.off();
      }, []);

      // Toggle Synthesized Gentle Rain Audio
      const toggleRain = () => {
        if (isPlayingRain) {
          if (audioCtxRef.current) {
            audioCtxRef.current.close();
            audioCtxRef.current = null;
          }
          setIsPlayingRain(false);
        } else {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            audioCtxRef.current = ctx;

            const bufferSize = ctx.sampleRate * 2;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            const gainNode = ctx.createGain();
            gainNode.gain.value = 0.15;

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(ctx.destination);

            whiteNoise.start();
            rainSourceRef.current = whiteNoise;
            setIsPlayingRain(true);
          } catch (e) {
            console.error("Audio playback error:", e);
          }
        }
      };

      // Post to Firebase Safe Wall
      const handleAddPost = (e) => {
        e.preventDefault();
        if (!newPost.trim()) return;

        db.ref('posts').push({
          text: newPost.trim(),
          timestamp: Date.now()
        });

        setNewPost('');
      };

      return (
        <div className="min-h-screen bg-[#fcfbf9] text-gray-700 flex flex-col items-center p-4 md:p-8">
          
          {/* Header */}
          <header className="w-full max-w-2xl flex items-center justify-between py-4 mb-6 border-b border-gray-100">
            <div className="flex items-center space-x-3">
              <LeafLogo />
              <h1 className="text-2xl font-light tracking-wide text-gray-800">Haven</h1>
            </div>

            {/* Gentle Rain Synthesizer Button */}
            <button
              onClick={toggleRain}
              className={`flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300 ${
                isPlayingRain 
                  ? 'bg-emerald-100 text-emerald-800 shadow-sm' 
                  : 'bg-white text-gray-500 border border-gray-200 hover:border-gray-300'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${isPlayingRain ? 'bg-emerald-500 animate-pulse' : 'bg-gray-300'}`}></span>
              <span>{isPlayingRain ? 'Rain Playing' : 'Gentle Rain'}</span>
            </button>
          </header>

          {/* Navigation Tabs */}
          <nav className="w-full max-w-2xl flex justify-around bg-white p-1.5 rounded-2xl shadow-sm border border-gray-100 mb-8">
            {[
              { id: 'ether', label: 'The Ether' },
              { id: 'wall', label: 'Safe Wall' },
              { id: 'battery', label: 'Social Battery' },
              { id: 'breathe', label: 'Breathe' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex-1 py-2 text-xs md:text-sm font-medium rounded-xl transition-all duration-200 ${
                  activeTab === tab.id
                    ? 'bg-[#f4f7f4] text-emerald-800 shadow-sm'
                    : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Content Area */}
          <main className="w-full max-w-2xl">
            
            {/* Tab 1: The Ether (Private Journal) */}
            {activeTab === 'ether' && (
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-medium text-gray-800">The Ether</h2>
                    <p className="text-xs text-gray-400">Write freely. Stored privately on your device.</p>
                  </div>
                  <button 
                    onClick={() => setEtherText('')}
                    className="text-xs text-gray-400 hover:text-rose-500 transition-colors"
                  >
                    Clear
                  </button>
                </div>
                <textarea
                  value={etherText}
                  onChange={(e) => setEtherText(e.target.value)}
                  placeholder="Type your quiet thoughts here..."
                  className="w-full h-64 p-4 rounded-2xl bg-[#faf9f6] border border-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-200 resize-none text-sm text-gray-700 leading-relaxed custom-scrollbar"
                />
              </div>
            )}

            {/* Tab 2: Safe Wall (Global Anonymous Feed) */}
            {activeTab === 'wall' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                  <h2 className="text-lg font-medium text-gray-800 mb-1">Safe Wall</h2>
                  <p className="text-xs text-gray-400 mb-4">Share a gentle note anonymously with the world.</p>
                  <form onSubmit={handleAddPost} className="flex gap-2">
                    <input
                      type="text"
                      value={newPost}
                      onChange={(e) => setNewPost(e.target.value)}
                      placeholder="Leave an anonymous note..."
                      maxLength={180}
                      className="flex-1 px-4 py-2.5 rounded-2xl bg-[#faf9f6] border border-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-200 text-sm"
                    />
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-2xl transition-all shadow-sm"
                    >
                      Post
                    </button>
                  </form>
                </div>

                <div className="space-y-3">
                  {wallPosts.length === 0 ? (
                    <div className="text-center py-8 text-gray-400 text-xs">
                      No posts on the wall yet. Be the first to leave a gentle thought.
                    </div>
                  ) : (
                    wallPosts.map((post) => (
                      <div key={post.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between space-y-2">
                        <p className="text-sm text-gray-700 leading-relaxed">{post.text}</p>
                        <span className="text-[10px] text-gray-400 self-end">
                          {new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* Tab 3: Social Battery */}
            {activeTab === 'battery' && (
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center space-y-6">
                <div>
                  <h2 className="text-lg font-medium text-gray-800">Social Battery</h2>
                  <p className="text-xs text-gray-400">Track how much energy you have to share today.</p>
                </div>

                <div className="py-6 flex flex-col items-center justify-center space-y-4">
                  <div className="text-4xl font-light text-emerald-700">{battery}%</div>
                  <div className="w-full max-w-xs bg-gray-100 h-4 rounded-full overflow-hidden p-0.5">
                    <div 
                      className="bg-emerald-500 h-full rounded-full transition-all duration-300" 
                      style={{ width: `${battery}%` }}
                    />
                  </div>
                </div>

                <div className="flex justify-center space-x-3">
                  {[0, 25, 50, 75, 100].map((val) => (
                    <button
                      key={val}
                      onClick={() => setBattery(val)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium border transition-all ${
                        battery === val 
                          ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                          : 'bg-white text-gray-500 border-gray-200 hover:border-gray-300'
                      }`}
                    >
                      {val}%
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Tab 4: Breathe */}
            {activeTab === 'breathe' && (
              <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 flex flex-col items-center text-center space-y-6">
                <div>
                  <h2 className="text-lg font-medium text-gray-800">Box Breathing</h2>
                  <p className="text-xs text-gray-400">Inhale, hold, exhale, hold.</p>
                </div>

                <div className="w-40 h-40 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center relative animate-pulse">
                  <div className="w-28 h-28 rounded-full bg-emerald-100/60 flex items-center justify-center">
                    <span className="text-xs font-medium text-emerald-800">Relax</span>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
