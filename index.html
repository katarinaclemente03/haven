<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfbf9;
      color: #2d3748;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDFOX_ChE_wPHNGyrLXGC2MiGCmAbe6rc",
      authDomain: "haven-25b0b.firebaseapp.com",
      databaseURL: "https://haven-25b0b-default-rtdb.firebaseio.com",
      projectId: "haven-25b0b",
      storageBucket: "haven-25b0b.firebasestorage.app",
      messagingSenderId: "78209014568",
      appId: "1:78209014568:web:b29094b308f8e1683b8e1d",
      measurementId: "G-QZ3XKHX58M"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { useState, useEffect, useRef } = React;

    const LeafLogo = () => (
      <svg className="w-7 h-7 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>
    );

    const BookmarkIcon = () => (
      <svg className="w-4 h-4 text-emerald-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
    );

    const WindIcon = () => (
      <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('ether');
      const [soundMode, setSoundMode] = useState('off');
      
      const [etherText, setEtherText] = useState(() => localStorage.getItem('haven_ether') || '');
      const [journalEntries, setJournalEntries] = useState(() => JSON.parse(localStorage.getItem('haven_journal_list')) || []);
      const [statusMessage, setStatusMessage] = useState('');

      const [wallPosts, setWallPosts] = useState([]);
      const [newPost, setNewPost] = useState('');
      const [battery, setBattery] = useState(() => parseInt(localStorage.getItem('haven_battery')) || 50);

      const audioRef = useRef(null);

      const soundUrls = {
        rain: "https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg",
        wind: "https://actions.google.com/sounds/v1/weather/wind_synthetic.ogg"
      };

      useEffect(() => {
        localStorage.setItem('haven_ether', etherText);
      }, [etherText]);

      useEffect(() => {
        localStorage.setItem('haven_journal_list', JSON.stringify(journalEntries));
      }, [journalEntries]);

      useEffect(() => {
        localStorage.setItem('haven_battery', battery.toString());
      }, [battery]);

      useEffect(() => {
        const postsRef = db.ref('posts');
        postsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const formatted = Object.keys(data).map(key => ({
              id: key,
              ...data[key]
            })).reverse();
            setWallPosts(formatted);
          } else {
            setWallPosts([]);
          }
        });

        return () => postsRef.off();
      }, []);

      const toggleSound = (mode) => {
        if (soundMode === mode) {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current = null;
          }
          setSoundMode('off');
          return;
        }

        if (audioRef.current) {
          audioRef.current.pause();
        }

        const audio = new Audio(soundUrls[mode]);
        audio.loop = true;
        audio.volume = 0.45;
        audio.play().then(() => {
          audioRef.current = audio;
          setSoundMode(mode);
        }).catch(err => {
          console.error("Audio block error:", err);
        });
      };

      useEffect(() => {
        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
          }
        };
      }, []);

      const handleSaveToJournal = () => {
        if (!etherText.trim()) return;
        const newEntry = {
          id: Date.now(),
          text: etherText.trim(),
          date: new Date().toLocaleDateString()
        };
        setJournalEntries([newEntry, ...journalEntries]);
        setStatusMessage('Saved to Journal');
        setTimeout(() => setStatusMessage(''), 2500);
      };

      const handleReleaseToEther = () => {
        if (!etherText.trim()) return;
        setEtherText('');
        setStatusMessage('Released into the ether...');
        setTimeout(() => setStatusMessage(''), 2500);
      };

      const handleAddPost = (e) => {
        e.preventDefault();
        if (!newPost.trim()) return;

        db.ref('posts').push({
          text: newPost.trim(),
          timestamp: Date.now()
        });

        setNewPost('');
      };

      return (
        <div className="min-h-screen bg-[#fcfbf9] text-gray-700 flex flex-col items-center p-4 md:p-8">
          
          {/* Header */}
          <header className="w-full max-w-2xl flex flex-wrap items-center justify-between gap-3 py-4 mb-6 border-b border-stone-200/60">
            <div className="flex items-center space-x-3">
              <LeafLogo />
              <div>
                <h1 className="text-2xl font-light tracking-wide text-stone-800">Haven</h1>
                <p className="text-[11px] text-stone-400">A calm, anonymous corner of the web</p>
              </div>
            </div>

            {/* Sound Controls */}
            <div className="flex items-center space-x-2">
              <button
                onClick={() => toggleSound('rain')}
                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300 ${
                  soundMode === 'rain'
                    ? 'bg-emerald-700 text-white shadow-sm'
                    : 'bg-white text-stone-600 border border-stone-200 hover:border-stone-300'
                }`}
              >
                🌧️ {soundMode === 'rain' ? 'Slow Rain' : 'Rain'}
              </button>

              <button
                onClick={() => toggleSound('wind')}
                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300 ${
                  soundMode === 'wind'
                    ? 'bg-teal-700 text-white shadow-sm'
                    : 'bg-white text-stone-600 border border-stone-200 hover:border-stone-300'
                }`}
              >
                🌬️ {soundMode === 'wind' ? 'Gentle Wind' : 'Wind'}
              </button>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav className="w-full max-w-2xl flex justify-around bg-stone-100/70 p-1.5 rounded-2xl border border-stone-200/50 mb-8">
            {[
              { id: 'ether', label: 'The Ether' },
              { id: 'wall', label: 'Safe Wall' },
              { id: 'battery', label: 'Social Battery' },
              { id: 'breathe', label: 'Breathe' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex-1 py-2 text-xs md:text-sm font-medium rounded-xl transition-all duration-200 ${
                  activeTab === tab.id
                    ? 'bg-white text-emerald-900 shadow-sm'
                    : 'text-stone-500 hover:text-stone-800'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Main Content Area */}
          <main className="w-full max-w-2xl">
            
            {/* The Ether */}
            {activeTab === 'ether' && (
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-200/70 flex flex-col space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-medium text-stone-800">The Ether</h2>
                    <p className="text-xs text-stone-400">Write freely. Saved strictly on your personal device.</p>
                  </div>
                  {statusMessage && (
                    <span className="text-xs font-medium text-emerald-700 animate-fade-in">{statusMessage}</span>
                  )}
                </div>

                <textarea
                  value={etherText}
                  onChange={(e) => setEtherText(e.target.value)}
                  placeholder="Type your quiet thoughts here..."
                  className="w-full h-60 p-4 rounded-2xl bg-[#faf9f6] border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-200 resize-none text-sm text-stone-700 leading-relaxed custom-scrollbar"
                />

                {/* Bottom Action Bar */}
                <div className="pt-3 border-t border-stone-100 flex items-center justify-end space-x-3">
                  <button
                    onClick={handleSaveToJournal}
                    className="flex items-center space-x-2 px-5 py-2.5 rounded-full border border-emerald-600/30 text-emerald-900 text-xs font-medium hover:bg-emerald-50 transition-all active:scale-95 shadow-sm"
                  >
                    <BookmarkIcon />
                    <span>Save to Journal</span>
                  </button>

                  <button
                    onClick={handleReleaseToEther}
                    className="flex items-center space-x-2 px-5 py-2.5 rounded-full bg-[#5d7d63] hover:bg-[#4f6c54] text-white text-xs font-medium transition-all active:scale-95 shadow-sm"
                  >
                    <WindIcon />
                    <span>Release to Ether</span>
                  </button>
                </div>

                {/* Saved Journal Entries */}
                {journalEntries.length > 0 && (
                  <div className="mt-6 pt-4 border-t border-stone-100 space-y-3">
                    <h3 className="text-xs font-medium text-stone-500 uppercase tracking-wider">Saved Journal Entries</h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
                      {journalEntries.map(entry => (
                        <div key={entry.id} className="p-3 bg-[#faf9f6] rounded-xl border border-stone-100 text-xs text-stone-600 flex justify-between items-start">
                          <p className="flex-1 pr-3">{entry.text}</p>
                          <span className="text-[10px] text-stone-400 shrink-0">{entry.date}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Safe Wall */}
            {activeTab === 'wall' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-emerald-900/5 to-teal-800/5 rounded-3xl p-6 shadow-sm border border-emerald-900/10 backdrop-blur-sm">
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <h2 className="text-lg font-medium text-stone-800">Safe Wall</h2>
                      <p className="text-xs text-stone-500">Leave a gentle note, encouragement, or quiet thought for others.</p>
                    </div>
                    <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-[10px] font-medium rounded-full">Global & Anonymous</span>
                  </div>

                  <form onSubmit={handleAddPost} className="mt-4 flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={newPost}
                      onChange={(e) => setNewPost(e.target.value)}
                      placeholder="Share something kind..."
                      maxLength={180}
                      className="flex-1 px-4 py-3 rounded-2xl bg-white/80 border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-300 text-sm placeholder:text-stone-400"
                    />
                    <button
                      type="submit"
                      className="px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-medium text-xs rounded-2xl transition-all shadow-sm active:scale-95"
                    >
                      Publish Note
                    </button>
                  </form>
                </div>

                <div className="space-y-3">
                  {wallPosts.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-3xl border border-stone-100 text-stone-400 text-xs">
                      The wall is completely still. Be the first to post a thought.
                    </div>
                  ) : (
                    wallPosts.map((post) => (
                      <div 
                        key={post.id} 
                        className="animate-fade-in bg-white p-5 rounded-2xl border border-stone-200/70 shadow-sm hover:shadow transition-all duration-200 flex flex-col justify-between space-y-3"
                      >
                        <p className="text-sm text-stone-700 leading-relaxed font-normal">{post.text}</p>
                        <div className="flex items-center justify-between border-t border-stone-100 pt-2.5">
                          <span className="text-[10px] text-emerald-700 font-medium bg-emerald-50 px-2 py-0.5 rounded-md">Anonymous</span>
                          <span className="text-[10px] text-stone-400">
                            {new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* Social Battery */}
            {activeTab === 'battery' && (
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-200/70 text-center space-y-6">
                <div>
                  <h2 className="text-lg font-medium text-stone-800">Social Battery</h2>
                  <p className="text-xs text-stone-400">Track how much energy you have to share today.</p>
                </div>

                <div className="py-6 flex flex-col items-center justify-center space-y-4">
                  <div className="text-4xl font-light text-emerald-800">{battery}%</div>
                  <div className="w-full max-w-xs bg-stone-100 h-4 rounded-full overflow-hidden p-0.5 border border-stone-200">
                    <div 
                      className="bg-emerald-600 h-full rounded-full transition-all duration-300" 
                      style={{ width: `${battery}%` }}
                    />
                  </div>
                </div>

                <div className="flex justify-center space-x-2">
                  {[0, 25, 50, 75, 100].map((val) => (
                    <button
                      key={val}
                      onClick={() => setBattery(val)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium border transition-all ${
                        battery === val 
                          ? 'bg-emerald-700 text-white border-emerald-700 shadow-sm' 
                          : 'bg-white text-stone-600 border-stone-200 hover:border-stone-300'
                      }`}
                    >
                      {val}%
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Breathe */}
            {activeTab === 'breathe' && (
              <div className="bg-white rounded-3xl p-8 shadow-sm border border-stone-200/70 flex flex-col items-center text-center space-y-6">
                <div>
                  <h2 className="text-lg font-medium text-stone-800">Box Breathing</h2>
                  <p className="text-xs text-stone-400">Inhale, hold, exhale, hold.</p>
                </div>

                <div className="w-40 h-40 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center relative animate-pulse">
                  <div className="w-28 h-28 rounded-full bg-emerald-100/60 flex items-center justify-center">
                    <span className="text-xs font-medium text-emerald-900">Relax</span>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
