<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven – Digital Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3ebe3',
                            500: '#587a61',
                            600: '#486851',
                            700: '#3a5240',
                        },
                        sand: '#f9f8f6'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f7f6f4;
            color: #2d3748;
            min-height: 100vh;
        }
        .light-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
            border-radius: 50%;
        }
        @keyframes floatUp {
            0% { opacity: 0.8; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.2); }
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <!-- Header / Navigation -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-sage-100 flex items-center justify-center text-sage-600">
                    <i data-lucide="leaf" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-serif text-xl font-semibold text-gray-900 leading-tight">Haven</h1>
                    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-medium">Your Digital Sanctuary</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex items-center bg-gray-100/80 p-1.5 rounded-full text-xs font-medium text-gray-600 space-x-1">
                <button class="flex items-center space-x-2 px-4 py-2 rounded-full bg-white text-gray-900 shadow-sm">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-sage-600"></i>
                    <span>The Ether</span>
                </button>
                <button class="flex items-center space-x-2 px-4 py-2 rounded-full hover:text-gray-900 transition-colors">
                    <i data-lucide="heart" class="w-3.5 h-3.5"></i>
                    <span>Safe Wall</span>
                </button>
                <button class="flex items-center space-x-2 px-4 py-2 rounded-full hover:text-gray-900 transition-colors">
                    <i data-lucide="battery-charging" class="w-3.5 h-3.5"></i>
                    <span>Social Battery</span>
                </button>
                <button class="flex items-center space-x-2 px-4 py-2 rounded-full hover:text-gray-900 transition-colors">
                    <i data-lucide="wind" class="w-3.5 h-3.5"></i>
                    <span>Breathe</span>
                </button>
            </nav>

            <!-- Gentle Rain Control -->
            <div class="flex items-center space-x-3 bg-sage-50 px-3.5 py-1.5 rounded-full border border-sage-100">
                <button id="rainToggleBtn" onclick="toggleRain()" class="flex items-center space-x-2 text-xs font-medium text-sage-700 hover:text-sage-600">
                    <i data-lucide="cloud-rain" class="w-4 h-4 text-sage-500"></i>
                    <span id="rainBtnText">Gentle Rain</span>
                </button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" oninput="adjustVolume(this.value)" class="w-16 accent-sage-600 bg-gray-200 rounded-lg h-1 cursor-pointer">
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-3xl mx-auto px-6 py-12 w-full space-y-8">

        <!-- Title Section -->
        <div class="text-center space-y-3">
            <h2 class="font-serif text-4xl text-gray-800 font-normal">The Ether</h2>
            <p class="text-sm text-gray-500 max-w-lg mx-auto leading-relaxed">
                A peaceful, unjudged space. Express what weighs on your heart. Save it quietly to your private journal, or dissolve it into light particles and let it go forever.
            </p>
        </div>

        <!-- Ether Writing Card -->
        <section class="light-card p-8 relative overflow-hidden space-y-6">
            
            <input id="entry-title" type="text" placeholder="Give your entry a title (optional)..." class="w-full text-lg font-serif placeholder-sage-500/60 text-gray-800 bg-transparent border-b border-gray-100 pb-3 focus:outline-none focus:border-sage-500 transition-colors">

            <textarea id="entry-body" oninput="updateWordCount()" placeholder="Begin writing here... No rules, no judgments." class="w-full h-56 bg-transparent text-gray-700 placeholder-sage-500/60 focus:outline-none resize-none leading-relaxed text-sm"></textarea>

            <div class="flex items-center justify-between pt-4 border-t border-gray-50">
                <span id="word-count" class="text-xs text-gray-400 italic">0 words</span>
                
                <div class="flex items-center space-x-3">
                    <button onclick="saveToJournal()" class="px-5 py-2.5 rounded-full border border-gray-200 text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
                        <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                        <span>Save to Journal</span>
                    </button>

                    <button onclick="releaseToEther(event)" class="px-5 py-2.5 rounded-full bg-sage-600 hover:bg-sage-700 text-white text-xs font-medium transition-all shadow-sm flex items-center space-x-2">
                        <i data-lucide="wind" class="w-3.5 h-3.5"></i>
                        <span>Release to Ether</span>
                    </button>
                </div>
            </div>

            <div id="particle-container" class="absolute inset-0 pointer-events-none"></div>
        </section>

    </main>

    <script>
        lucide.createIcons();

        // Word Count Tracker
        function updateWordCount() {
            const text = document.getElementById('entry-body').value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            document.getElementById('word-count').innerText = `${words} words`;
        }

        // Particle Release Effect
        function releaseToEther(e) {
            const body = document.getElementById('entry-body');
            const title = document.getElementById('entry-title');
            if(!body.value.trim() && !title.value.trim()) return;

            const container = document.getElementById('particle-container');
            const rect = e.target.getBoundingClientRect();

            for(let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle bg-sage-500';
                const size = Math.random() * 6 + 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = (Math.random() * 240 - 120) + (rect.left - container.getBoundingClientRect().left) + 'px';
                particle.style.top = (rect.top - container.getBoundingClientRect().top) + 'px';
                container.appendChild(particle);

                setTimeout(() => particle.remove(), 3000);
            }

            title.value = '';
            body.value = '';
            updateWordCount();
        }

        function saveToJournal() {
            const body = document.getElementById('entry-body');
            if(!body.value.trim()) return;
            alert('Saved quietly to your private journal.');
            document.getElementById('entry-title').value = '';
            body.value = '';
            updateWordCount();
        }

        // Gentle Rain Sound Generator Engine
        let audioCtx;
        let masterGain;
        let noiseSource = null;
        let isPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = document.getElementById('volumeSlider').value;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleRain() {
            initAudio();
            if (isPlaying) {
                stopRain();
            } else {
                startRain();
            }
        }

        function startRain() {
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1600;

            noiseSource.connect(filter);
            filter.connect(masterGain);
            noiseSource.start();

            isPlaying = true;
            document.getElementById('rainBtnText').innerText = 'Pause Rain';
        }

        function stopRain() {
            if (noiseSource) {
                noiseSource.stop();
                noiseSource.disconnect();
                noiseSource = null;
            }
            isPlaying = false;
            document.getElementById('rainBtnText').innerText = 'Gentle Rain';
        }

        function adjustVolume(val) {
            if (masterGain) {
                masterGain.gain.value = val;
            }
        }
    </script>
</body>
</html>
